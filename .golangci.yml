version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - unconvert
    - unparam

formatters:
  enable:
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/fbsobreira/gotron-examples
